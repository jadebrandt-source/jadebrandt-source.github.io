<script>
  const pages = document.querySelectorAll('.page');
  let currentIndex = 0;

  // -------- PRICE ANIMATION --------
  function showPage(index) {
    pages.forEach(p => p.classList.remove('active'));
    const page = pages[index];
    page.classList.add('active');
    animatePrice(page);
  }

  function animatePrice(page) {
    const target = parseFloat(page.dataset.price);
    const span = page.querySelector('.price-value');

    let current = 0;
    span.textContent = "0";

    const duration = 800;
    const steps = 60;
    const increment = target / steps;
    const interval = duration / steps;

    let count = 0;

    const timer = setInterval(() => {
      count++;
      current += increment;

      if (count >= steps) {
        span.textContent = target.toFixed(2).replace('.00', '');
        clearInterval(timer);
      } else {
        span.textContent = current.toFixed(2);
      }
    }, interval);
  }

  animatePrice(pages[0]);

  // -------- PRECISE SCROLL LOGIC --------
  let accumulatedDelta = 0;
  const THRESHOLD = 80;      // how hard you must scroll
  let isScrolling = false;
  const COOLDOWN = 900;     // ms between page changes

  window.addEventListener('wheel', (e) => {
    if (isScrolling) return;

    accumulatedDelta += e.deltaY;

    if (Math.abs(accumulatedDelta) < THRESHOLD) return;

    isScrolling = true;

    if (accumulatedDelta > 0) {
      currentIndex = Math.min(currentIndex + 1, pages.length - 1);
    } else {
      currentIndex = Math.max(currentIndex - 1, 0);
    }

    accumulatedDelta = 0;
    showPage(currentIndex);

    setTimeout(() => {
      isScrolling = false;
    }, COOLDOWN);

  }, { passive: true });
</script>

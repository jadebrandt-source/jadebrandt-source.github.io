    body {
  height: 100vh;

    .container {

      height: 100vh;
      position: relative;

    .page {

      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .page.active {
      opacity: 1;
      pointer-events: auto;
    }

.background-image {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: top center;
  z-index: -1;
  transition: transform 0.5s ease;
  /* fallback color if image doesn't fully cover */
  background-color: #e6f0ff;
}



.page img {

  max-height: 50vh;
  margin-bottom: 24px;
  z-index: 1;
}


img {

.price-value {

}

.price {

/* Overlay for unlocking audio */

  <script>
    const pages = document.querySelectorAll('.page');
const bgImage = document.querySelector('.background-image');

let currentIndex = 0;
const totalPages = 13; // maximum scrolls/pages
const shortSound = document.getElementById("shortScrollSound");
const longSound = document.getElementById("longScrollSound");
let audioUnlocked = false;
let isScrolling = false;
let accumulatedDelta = 0;

const THRESHOLD = 80; // minimum wheel delta to trigger scroll
const LONG_SCROLL_THRESHOLD = 300; // bigger scroll
const COOLDOWN = 900; // ms between page changes

// Unlock audio
document.getElementById("unlockOverlay").addEventListener("click", () => {
  [shortSound, longSound].forEach(s => {
    s.play().then(() => { s.pause(); s.currentTime = 0; }).catch(()=>{});
  });
  audioUnlocked = true;
  document.getElementById("unlockOverlay").style.display = "none";
});

// Show a page and animate price
function showPage(index) {
  pages.forEach(p => p.classList.remove('active'));
  const page = pages[index];
  page.classList.add('active');
  animatePrice(page);

  // Move background progressively
  let progress = index / (totalPages - 1);
  bgImage.style.transform = `translateY(${progress * 100}%)`;
}

// Price animation
function animatePrice(page) {
  const target = parseFloat(page.dataset.price);
  const span = page.querySelector('.price-value');
  let current = 0;
  span.textContent = "0";

  const duration = 800;
  const steps = 60;
  const increment = target / steps;
  const interval = duration / steps;
  let count = 0;

  const timer = setInterval(() => {
    count++;
    current += increment;
    if(count >= steps) {
      span.textContent = target.toFixed(2).replace('.00','');
      clearInterval(timer);
    } else {
      span.textContent = current.toFixed(2);
    }
  }, interval);
}

// Initial page
showPage(0);

// Scroll handling
window.addEventListener('wheel', e => {
  if(!audioUnlocked) return;
  if(isScrolling) return;

  accumulatedDelta += e.deltaY;
  if(Math.abs(accumulatedDelta) < THRESHOLD) return;

  isScrolling = true;

  // Determine scroll sound
  const scrollType = Math.abs(accumulatedDelta) > LONG_SCROLL_THRESHOLD ? "long" : "short";
  const sound = scrollType === "long" ? longSound : shortSound;
  sound.currentTime = 0;
  sound.play();

  // Update page index
  if(accumulatedDelta > 0) {
    currentIndex = Math.min(currentIndex + 1, totalPages - 1);
  } else {
    currentIndex = Math.max(currentIndex - 1, 0);
  }

  accumulatedDelta = 0;
  showPage(currentIndex);

  setTimeout(() => { isScrolling = false; }, COOLDOWN);
}, { passive: true });

  </script>
